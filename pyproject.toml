[project]
name = "agent-ops-warehouse-loader"
version = "0.1.0"
description = "Minimal ETL loader for agent-ops-warehouse. P0 scope: extraction to NDJSON only, no cloud dependencies."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
