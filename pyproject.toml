[project]
name = "agent-ops-warehouse-loader"
version = "0.1.0"
description = "Minimal ETL loader for agent-ops-warehouse. P0 scope: extraction to NDJSON only, no cloud dependencies."
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
# httpx2 is required by fastapi.testclient.TestClient / starlette >=1.6 in a
# clean environment (verified 2026-08-12: fresh venv with only pytest+
# fastapi+uvicorn installed raises "starlette.testclient module requires the
# httpx2 package" at collection time). This repo's dev .venv had it masked
# by an older httpx already present as a transitive google-genai dependency
# (a deprecation warning, not a hard failure) -- CI has no such transitive
# install, so httpx2 is declared explicitly rather than relying on that.
dev = ["pytest>=7.4", "httpx2"]
# P2: dbt Core for staging/marts (dbt/). Pinned exact versions -- dbt moves
# fast and an unpinned install is not reproducible for fork-and-deploy.
# NOTE (Python 3.14 only): dbt-core 1.12.0 declares `mashumaro<3.18`, but
# mashumaro <3.18 fails to import on Python 3.14 (JSONObjectSchema.schema
# field is not serializable -- a dbt_common/mashumaro bug on very new
# CPython, unrelated to this project). On Python 3.14, after installing
# this extra, also run `pip install --upgrade mashumaro` (pip will warn
# about the version bound above; the newer mashumaro works and the warning
# is safe to ignore). Python <=3.13 needs no such override.
dbt = ["dbt-core==1.12.0", "dbt-bigquery==1.12.0"]
# P3: FastAPI RAG service (api/) -- SPEC-agent-ops-warehouse-rag-api_20260811.md
# Section 4.4 / 4.5. In this repo's own test suite, every test that would
# reach google-genai monkeypatches build_gemini_client, so google-genai's
# absence never surfaces in `pytest`. It is declared here explicitly
# because the Cloud Run deployment (Section 4.5, terraform/cloud_run.tf)
# is real production traffic, not a test double: api/main.py's
# embed_question()/summarize_answer() call
# scripts.build_embeddings.build_gemini_client(), which does
# `from google import genai` at request time. Before this line was added
# (found while writing the Dockerfile, 2026-08-12), google-genai was only
# ever present transitively via the separate `dbt` extra
# (dbt-bigquery -> google-cloud-aiplatform -> google-genai) -- an extra
# the Cloud Run image never installs -- so every real /query request would
# have 503'd on ImportError while /health kept returning 200 (the exact
# "既存資産の再利用を優先する" quote below described where the *client
# factory function* is reused from, not where the *package* would come
# from at runtime; those turned out to be two different things).
# google-cloud-bigquery IS declared explicitly here (Phase 3.6 / SPEC
# Section 9 phase 3.6): tests/test_api_bigquery_cost_cap.py constructs a
# real bigquery.QueryJobConfig (a local object, no network call) to verify
# api.main.build_query_job_config passes the real SDK's maximum_bytes_billed
# kwarg correctly -- unlike build_bigquery_client's Client()/client.query(),
# which every test monkeypatches away entirely, this one line of the real
# SDK does run in the test suite, so it can no longer rely on being merely
# a transitive dbt-bigquery install (dbt is a separate CI job that does not
# run the api/ test suite -- see .github/workflows/ci.yml's "python" job).
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-bigquery>=3.0",
    "google-genai>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit package list -- setuptools' flat-layout auto-discovery treats
# every top-level directory (out/, dbt/, terraform/, queries/, evidence/,
# logs/) as an ambiguous package candidate and refuses to build ("Multiple
# top-level packages discovered in a flat-layout"), verified 2026-08-12
# while writing the Cloud Run Dockerfile and again while fixing CI's
# dependency-drift bug (three real dependency gaps -- httpx2/fastapi/
# uvicorn in Phase 3, google-cloud-bigquery in Phase 3.6, google-genai in
# Phase 4 -- all traced back to CI hand-listing packages instead of
# installing from this file's own [project.optional-dependencies], which
# `pip install -e .` could not do until this list existed). This is the
# same package set the Dockerfile COPYs.
packages = ["api", "loader", "scripts"]
