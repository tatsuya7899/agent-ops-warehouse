name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — gitleaksがgit履歴全体を見るためfetch-depth 0が必要)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (git履歴全体のシークレットスキャン、push時のみ)
        # 実CI失敗で発覚(2026-09-13): gitleaks-actionはpull_requestイベントで
        # 「PRのコミット一覧取得」(GET /pulls/{n}/commits)を無条件に行い`pull-requests:
        # read`を要求する。GITLEAKS_ENABLE_COMMENTS=falseはコメント投稿側は防げるが
        # このread側の呼び出しは防げないと実機で確認済み。pull_request時はスキップする。
        # v2→v3化(Node 20が2026-09-16に廃止されるため)とコメント無効化自体は維持する
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # Install from pyproject.toml's own [dev]+[api] extras instead of
        # hand-listing packages here -- the hand-listed version drifted out
        # of sync with actual runtime imports three separate times (Phase 3:
        # fastapi/uvicorn/httpx2 missing; Phase 3.6: google-cloud-bigquery
        # missing; Phase 4: google-genai missing, caught only when CI failed
        # on a push already believed green because `pytest`/`ruff` had been
        # re-run locally -- against the *old* venv, which still had the
        # stale transitive install). `pip install -e .` needs the explicit
        # [tool.setuptools] packages list added in this same commit --
        # without it, setuptools' flat-layout auto-discovery refuses to
        # build (ambiguous top-level dirs: out/, dbt/, terraform/, ...).
        run: pip install ruff && pip install -e ".[dev,api]"
      - name: Lint
        # linter段階導入計画 Category 4.1(2026-09-13)。従来の暗黙デフォルト(E4/E7/E9/F)は
        # pyproject.tomlのselectへ明示化した上でここでは従来どおりブロッキングのまま維持する。
        run: ruff check --select=E4,E7,E9,F loader/ scripts/ api/ tests/
      - name: Lint (security rules、informational・非ブロッキング)
        # baseline実測(2026-09-13、tests/配下のS101/S108除外後): 19件(S607×10・S603×8・S608×1)。
        # 是正は別タスク
        run: ruff check --select=S loader/ scripts/ api/ tests/ || true
      - name: Test
        run: pytest -q

  shell-lint:
    name: Shell Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck(informational・非ブロッキング)
        # linter段階導入計画 Category 2.4(2026-09-13)。対象1本(scripts/query_articles.sh)。
        # baseline実測(2026-09-13・severity=warning): 0件
        run: |
          sudo apt-get install -y shellcheck -qq
          shellcheck --severity=warning scripts/query_articles.sh || true

  lint-workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint(ブロッキング — baseline 0件実測 2026-09-13)
        # 敵対的レビューで指摘(2026-09-13・m-3是正): 従来pythonジョブ末尾に同居させていたため
        # CI結果画面でactionlint/zizmor由来の失敗かruff/pytest由来かが区別しにくかった。
        # 他3リポジトリと同じ独立ジョブ構成に揃える
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: "zizmor(informational・非ブロッキング。baseline実測2026-09-13: 23件medium9/high9)"
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        continue-on-error: true
        with:
          # 敵対的レビューで指摘(2026-09-13・m-2是正): version未固定だとzizmor自体の
          # ルール更新でbaseline件数が陳腐化する。CLI版数を固定して再現性を持たせる
          version: "1.30.1"
          advanced-security: "false"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: tflint --chdir=.

  dbt:
    # Parse/compile only -- no BigQuery connection, no ADC available on the
    # runner. Confirms sources.yml/schema.yml/models are internally
    # consistent (refs resolve, YAML is valid, custom generic tests compile)
    # without touching real data.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      AOW_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dbt
        run: pip install "dbt-core==1.12.0" "dbt-bigquery==1.12.0"
      - name: Parse
        run: dbt parse --profiles-dir .
