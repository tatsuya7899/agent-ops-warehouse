name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # google-cloud-bigquery (Phase 3.6 / SPEC Section 9 phase 3.6):
        # tests/test_api_bigquery_cost_cap.py constructs a real
        # bigquery.QueryJobConfig (local object, no network call) to check
        # api.main passes the real SDK's maximum_bytes_billed kwarg --
        # previously this package was only ever imported inside functions
        # every test monkeypatched away, so CI never needed it installed.
        run: pip install pytest ruff fastapi "uvicorn[standard]" httpx2 google-cloud-bigquery
      - name: Lint
        run: ruff check loader/ scripts/ api/ tests/
      - name: Test
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: tflint --chdir=.

  dbt:
    # Parse/compile only -- no BigQuery connection, no ADC available on the
    # runner. Confirms sources.yml/schema.yml/models are internally
    # consistent (refs resolve, YAML is valid, custom generic tests compile)
    # without touching real data.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      AOW_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dbt
        run: pip install "dbt-core==1.12.0" "dbt-bigquery==1.12.0"
      - name: Parse
        run: dbt parse --profiles-dir .
